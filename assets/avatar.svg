<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="100%" height="100%">
  <!-- Background: Red National Exam Passport Photo (3x4) -->
  <rect width="120" height="150" fill="#b91c1c" rx="4"/>
  <!-- Light vignette -->
  <radialGradient id="photoLight" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="120" height="150" fill="url(#photoLight)" rx="4"/>
  <!-- Head & Neck -->
  <ellipse cx="60" cy="56" rx="22" ry="26" fill="#fcd34d"/>
  <rect x="52" y="76" width="16" height="18" fill="#f59e0b" rx="3"/>
  <!-- Hair -->
  <path d="M 38 52 C 38 28, 82 28, 82 52 C 82 40, 38 40, 38 52 Z" fill="#1e293b"/>
  <!-- White Formal Shirt -->
  <path d="M 20 150 L 32 94 L 52 94 L 60 112 L 68 94 L 88 94 L 100 150 Z" fill="#ffffff"/>
  <!-- Shirt Collar -->
  <polygon points="40,94 60,118 52,94" fill="#e2e8f0"/>
  <polygon points="80,94 60,118 68,94" fill="#e2e8f0"/>
  <!-- Dark Blue Tie / Blazer -->
  <path d="M 12 150 L 32 94 L 20 94 L 0 150 Z" fill="#0f172a"/>
  <path d="M 108 150 L 88 94 L 100 94 L 120 150 Z" fill="#0f172a"/>
  <polygon points="56,108 64,108 66,145 60,150 54,145" fill="#1e3a8a"/>
  <!-- Text Label -->
  <rect x="10" y="128" width="100" height="16" fill="#0f172a" opacity="0.9" rx="2"/>
  <text x="60" y="140" fill="#ffffff" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="0.8">FOTO PESERTA</text>
</svg>
